name: CI
on:
  push:
    branches: [master]
  pull_request: # incl. the flake.lock update PRs
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: fatteh, runner: ubuntu-latest }
          - { host: manakish, runner: ubuntu-latest }
          - { host: makanek, runner: ubuntu-latest }
          - { host: zaatar, runner: ubuntu-latest }
          # native arm: ful's evaluation builds an aarch64 derivation (IFD)
          - { host: ful, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      # no submodules: the secrets repo is private
      - uses: actions/checkout@v7
      # desktop builds need ~47 GiB of inputs; the runner has 14 GB free
      - uses: wimpysworld/nothing-but-nix@v10
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            build-dir = /nix/build
      - uses: cachix/cachix-action@v17
        with:
          name: kmein
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # unfree binaries (just a download + patchelf) and build-only intermediates;
          # omp and claude-code are already in cache.numtide.com
          pushFilter: '(zoom|vscode|ferdium|spotify|tor-browser|texlive-combined|obsidian|0ad-data|nvidia-x11|omp-|claude-code|cargo-package-|-vendor|\.tar\.|\.zip$)'
      - name: Mock secrets
        run: |
          git submodule deinit -f secrets
          rm -rf .git/modules/secrets
          git rm -f secrets
          mkdir secrets
          xargs touch < secrets.txt
          git add secrets
      - name: Build
        run: nix build --print-build-logs ".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel"
